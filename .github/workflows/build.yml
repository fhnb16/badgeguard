name: Build distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dist and dist-single
        run: node build.mjs
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: badgeguard-distributions
          path: |
            dist/
            dist-single/
          if-no-files-found: error
