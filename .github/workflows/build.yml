name: Build distributions

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distributions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build dist and dist-single
        run: node build.mjs
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: badgeguard-distributions
          path: |
            dist/
            dist-single/
          if-no-files-found: error

  sync-distributions:
    needs: build
    if: github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: badgeguard-distributions
          path: .
      - name: Commit generated distributions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist dist-single
          if git diff --cached --quiet; then
            echo "Generated distributions are already up to date."
          else
            git commit -m "build: update generated distributions"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  release:
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: badgeguard-distributions
          path: .
      - name: Package release files
        id: release_files
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          pwa_zip="badgeguard-pwa-${version}.zip"
          standalone_html="badgeguard-standalone-${version}.html"
          (cd dist && zip -qr "../${pwa_zip}" .)
          cp dist-single/index.html "${standalone_html}"
          echo "pwa_zip=${pwa_zip}" >> "$GITHUB_OUTPUT"
          echo "standalone_html=${standalone_html}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "${{ steps.release_files.outputs.pwa_zip }}" \
              "${{ steps.release_files.outputs.standalone_html }}" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${{ steps.release_files.outputs.pwa_zip }}" \
              "${{ steps.release_files.outputs.standalone_html }}" \
              --title "BadgeGuard ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
